<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="320" height="180">
  <!-- Purple background -->
  <rect width="320" height="180" rx="18" fill="#4B0082"/>

  <!-- Globe (yellow circle) -->
  <circle cx="160" cy="72" r="38" fill="#FFD700" stroke="#FFD700" stroke-width="2"/>
  <!-- Globe latitude lines -->
  <ellipse cx="160" cy="72" rx="22" ry="38" fill="none" stroke="#4B0082" stroke-width="2"/>
  <line x1="122" y1="72" x2="198" y2="72" stroke="#4B0082" stroke-width="2"/>
  <line x1="126" y1="55" x2="194" y2="55" stroke="#4B0082" stroke-width="1.2"/>
  <line x1="126" y1="89" x2="194" y2="89" stroke="#4B0082" stroke-width="1.2"/>

  <!-- Truck body (wrapping around/below globe) -->
  <!-- Cab -->
  <rect x="96" y="96" width="52" height="32" rx="6" fill="#FFD700"/>
  <!-- Cargo container -->
  <rect x="148" y="90" width="76" height="38" rx="5" fill="#FFD700"/>
  <!-- Cargo container highlight stripe -->
  <rect x="150" y="92" width="72" height="6" rx="3" fill="#FFF176"/>
  <!-- Windows on cab -->
  <rect x="102" y="100" width="20" height="14" rx="3" fill="#4B0082"/>
  <!-- Grill -->
  <rect x="96" y="118" width="52" height="8" rx="3" fill="#e6b800"/>
  <!-- Wheels -->
  <circle cx="115" cy="132" r="9" fill="#222"/>
  <circle cx="115" cy="132" r="4.5" fill="#888"/>
  <circle cx="185" cy="132" r="9" fill="#222"/>
  <circle cx="185" cy="132" r="4.5" fill="#888"/>
  <circle cx="208" cy="132" r="9" fill="#222"/>
  <circle cx="208" cy="132" r="4.5" fill="#888"/>

  <!-- MYFRETES text -->
  <text x="160" y="163" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="22" letter-spacing="2">
    <tspan fill="#FFD700">MY</tspan><tspan fill="#FFFFFF">FRETES</tspan>
  </text>
</svg>
